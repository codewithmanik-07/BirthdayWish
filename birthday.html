<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Royalty Birthday Surprise!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #08070c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .container {
            width: 88%;
            max-width: 380px;
            text-align: center;
            position: relative;
        }

        /* Luxury Envelope Screen */
        .envelope-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 25px;
            padding: 40px 20px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .envelope-wrapper:active {
            transform: scale(0.96);
        }

        .icon-glow {
            font-size: 70px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); }
            100% { transform: scale(1.1); filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.8)); }
        }

        .tap-btn {
            margin-top: 25px;
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa771c);
            color: #000;
            font-weight: 700;
            border-radius: 50px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.85rem;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* Main Surprise Card Screen */
        .royal-card {
            display: none;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.25);
            animation: cardReveal 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes cardReveal {
            from { opacity: 0; transform: scale(0.8) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .crown {
            font-size: 45px;
            margin-bottom: 5px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .sub-title {
            color: #d4af37;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .name-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff 20%, #d4af37 50%, #ffffff 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .divider {
            width: 50px;
            height: 2px;
            background: #d4af37;
            margin: 0 auto 20px auto;
            border-radius: 2px;
        }

        .wish-text {
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.7;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .footer-tag {
            font-size: 0.85rem;
            color: #d4af37;
            letter-spacing: 1px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="envelope-wrapper" id="startScreen" onclick="revealSurprise()">
            <div class="icon-glow">✨👑✨</div>
            <div class="tap-btn">Unlock Surprise</div>
        </div>

        <div class="royal-card" id="cardScreen">
            <div class="crown">👑</div>
            <div class="sub-title">Happy Birthday</div>
            
            <h1 class="name-title" id="personName">Your Name</h1>
            
            <div class="divider"></div>
            
            <p class="wish-text" id="customWish">
                Wishing you a extraordinary day filled with unforgettable moments, endless happiness, and pure luxury. May your journey ahead shine brighter than ever! ✨
            </p>
            
            <div class="footer-tag" id="senderName">— Dedicated to You ❤️</div>
        </div>
    </div>

    <script>
        // ==========================================
        // ✏️ এখানে নাম এবং উইশ কাস্টমাইজ করুন:
        // ==========================================
        const CONFIG = {
            name: "Ratul", // যার জন্মদিন তার নাম লিখুন
            wish: "হ্যাপি বার্থডে দোস্ত! 🥳🎉 > আজকের দিনটা পুরো তোর জন্য! জীবনের সব ভালো কিছু আর সাফল্য তোকেই ছুঁয়ে যাক। আজকের দিনটা খুব ভালোভাবে উপভোগ কর, আর পার্টি কিন্তু পাওনা রইল! 🍰🚀Wishing you an extraordinary day filled with unforgettable moments, endless happiness, and luxury. May your journey ahead shine brighter than ever! ✨", 
            sender: "— From Your Best Friend Manik❤️" // পাঠাচ্ছেন তার নাম
        };

        // Name and wish injection
        document.getElementById('personName').innerText = CONFIG.name;
        document.getElementById('customWish').innerText = CONFIG.wish;
        document.getElementById('senderName').innerText = CONFIG.sender;

        function revealSurprise() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('cardScreen').style.display = 'block';

            // Premium Golden Confetti Burst
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#d4af37', '#ffffff', '#ffd700']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#d4af37', '#ffffff', '#ffd700']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }
    </script>
</body>
</html>
